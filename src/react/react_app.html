<!DOCTYPE html>
<html>
    <head>
        <!-- 文字エンコーディングをUTF-8に設定 -->
        <meta charset="utf-8">
        <!-- IEの互換モードを有効化 -->
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <!-- モバイルデバイスでの表示を最適化 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple React19 App No JSX by SDN</title>
        <!-- ReactとReactDOMをCDNから読み込み -->
        <script type="module">
            // Reactのコアライブラリをインポート
            import React from "https://esm.sh/react@19.1.0"
            // ReactDOMクライアントをインポート（ブラウザでのレンダリング用）
            import ReactDOMClient from "https://esm.sh/react-dom@19.1.0/client"

            const root = document.getElementById("root");
            const rootElement = ReactDOMClient.createRoot(root);
            const element = React.createElement("p", {}, "Welcome to React-World!");
            rootElement.render(element);
        </script>
    </head>
    <body>
        <h1>React</h1>
        <!-- Reactアプリケーションのマウントポイント -->
        <div id="root">wait...</div>
    </body>
</html>
